status-website:
  # No custom domain — using the default GitHub Pages project URL instead
  baseUrl: /upptime
  name: senrecep Status
  introTitle: "**Servis Durumu** — sunucularımın ve sitelerimin canlı durumu."
  introMessage: Bu sayfa, [GitHub reposundan](https://github.com/senrecep/upptime) gelen **gerçek zamanlı** verileri kullanır. Sunucu bağımsız olarak GitHub Actions, Issues ve Pages üzerinde çalışır.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Notifications: sent via Telegram when a site goes down or comes back up
notifications:
  - type: telegram
    bot-token: $TELEGRAM_BOT_TOKEN
    chat-id: $TELEGRAM_CHAT_ID

